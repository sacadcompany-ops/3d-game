name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Applet Dependencies
        run: npm install --legacy-peer-deps

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Production Bundle Build
        run: npm run build
