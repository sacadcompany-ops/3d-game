name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true

      - name: Sync Web Assets to Android Platform
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Tagged APK
        run: |
          mkdir -p build/android
          TAG_NAME="${{ github.ref_name }}"
          TARGET_APK="build/android/Somaliland-Driving-Simulator-${TAG_NAME}.apk"
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "${TARGET_APK}"
          else
            find android/app/build/outputs/ -name "*.apk" -exec cp {} "${TARGET_APK}" \;
          fi
          echo "RELEASE_APK=${TARGET_APK}" >> $GITHUB_ENV

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          name: Somaliland Driving Simulator ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
