name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true

      - name: Sync Web Assets to Android Platform
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output Directory
        run: |
          mkdir -p build/android
          # Copy generated APK to target name
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build/android/Somaliland-Driving-Simulator.apk
          else
            find android/app/build/outputs/ -name "*.apk" -exec cp {} build/android/Somaliland-Driving-Simulator.apk \;
          fi

      - name: Verify APK Generation
        run: |
          if [ ! -f "build/android/Somaliland-Driving-Simulator.apk" ]; then
            echo "Error: APK file was not created!"
            exit 1
          fi
          echo "APK successfully built: $(ls -lh build/android/Somaliland-Driving-Simulator.apk)"

      - name: Upload Somaliland Driving Simulator APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Somaliland-Driving-Simulator-APK
          path: build/android/Somaliland-Driving-Simulator.apk
          retention-days: 30
